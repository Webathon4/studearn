<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Gear Icon -->
  <g transform="translate(100, 80)">
    <!-- Outer circle -->
    <circle cx="60" cy="60" r="45" fill="none" stroke="currentColor" stroke-width="3"/>
    
    <!-- Gear teeth -->
    <g stroke="currentColor" stroke-width="3" fill="none">
      <rect x="55" y="5" width="10" height="20" rx="2"/>
      <rect x="55" y="135" width="10" height="20" rx="2" transform="rotate(180 60 145)"/>
      <rect x="135" y="55" width="20" height="10" rx="2" transform="rotate(90 145 60)"/>
      <rect x="5" y="55" width="20" height="10" rx="2" transform="rotate(-90 15 60)"/>
      
      <!-- Diagonal teeth -->
      <rect x="100" y="20" width="15" height="15" rx="2" transform="rotate(45 107.5 27.5)"/>
      <rect x="45" y="125" width="15" height="15" rx="2" transform="rotate(45 52.5 132.5)"/>
      <rect x="125" y="100" width="15" height="15" rx="2" transform="rotate(45 132.5 107.5)"/>
      <rect x="20" y="25" width="15" height="15" rx="2" transform="rotate(45 27.5 32.5)"/>
    </g>
    
    <!-- Inner chart/bars -->
    <g fill="currentColor" opacity="0.8">
      <rect x="40" y="45" width="8" height="30"/>
      <rect x="52" y="35" width="8" height="40"/>
      <rect x="64" y="40" width="8" height="35"/>
      <rect x="76" y="50" width="8" height="25"/>
    </g>
  </g>
  
  <!-- Briefcase Icon (small, bottom right) -->
  <g transform="translate(155, 110)">
    <rect x="10" y="15" width="50" height="35" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="20" y="8" width="30" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="35" y1="15" x2="35" y2="8" stroke="currentColor" stroke-width="2"/>
  </g>
  
  <!-- Text: STUDEARN -->
  <g font-family="Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="-2">
    <!-- STUD in black -->
    <text x="25" y="280" fill="currentColor">STUD</text>
    
    <!-- EARN in orange/gold -->
    <text x="225" y="280" fill="#F59E0B">EARN</text>
  </g>
</svg>